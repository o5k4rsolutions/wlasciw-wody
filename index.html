        function initDipoleAnimation() {
            const canvas = document.getElementById('dipole-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let angle = 0;

            function draw() {
                const currentCanvas = document.getElementById('dipole-canvas');
                if (!currentCanvas) {
                    if (dipoleAnimId) cancelAnimationFrame(dipoleAnimId);
                    return;
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;

                angle += 0.012;

                const ox = cx;
                const oy = cy - 10;
                const oRadius = canvas.width * 0.18; 

                const hDist = canvas.width * 0.27;
                const baseAngle1 = (104.5 / 2) * Math.PI / 180;
                const baseAngle2 = -(104.5 / 2) * Math.PI / 180;

                const h1x = cx + Math.sin(baseAngle1) * hDist * Math.cos(angle);
                const h1y = cy + Math.cos(baseAngle1) * hDist - 10;
                const h1z = Math.sin(baseAngle1) * hDist * Math.sin(angle);

                const h2x = cx + Math.sin(baseAngle2) * hDist * Math.cos(angle);
                const h2y = cy + Math.cos(baseAngle2) * hDist - 10;
                const h2z = Math.sin(baseAngle2) * hDist * Math.sin(angle);

                const hRadius = canvas.width * 0.10;

                ctx.lineWidth = canvas.width * 0.058;
                ctx.lineCap = "round";
                
                ctx.beginPath();
                ctx.strokeStyle = '#cbd5e1';
                ctx.moveTo(ox, oy);
                ctx.lineTo(h1x, h1y);
                ctx.stroke();

                ctx.beginPath();
                ctx.strokeStyle = '#cbd5e1';
                ctx.moveTo(ox, oy);
                ctx.lineTo(h2x, h2y);
                ctx.stroke();

                const atoms = [
                    { name: 'O', x: ox, y: oy, r: oRadius, color: '#ef4444', labelColor: '#ffffff', z: 0, sign: '-' },
                    { name: 'H', x: h1x, y: h1y, r: hRadius, color: '#3b82f6', labelColor: '#ffffff', z: h1z, sign: '+' },
                    { name: 'H', x: h2x, y: h2y, r: hRadius, color: '#3b82f6', labelColor: '#ffffff', z: h2z, sign: '+' }
                ];

                atoms.sort((a, b) => a.z - b.z);

                atoms.forEach(atom => {
                    ctx.beginPath();
                    ctx.arc(atom.x + 3, atom.y + 3, atom.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(0,0,0,0.06)';
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(atom.x, atom.y, atom.r, 0, Math.PI * 2);
                    
                    const gradient = ctx.createRadialGradient(
                        atom.x - atom.r/3, atom.y - atom.r/3, atom.r/10,
                        atom.x, atom.y, atom.r
                    );
                    gradient.addColorStop(0, '#ffffff');
                    gradient.addColorStop(0.2, atom.color);
                    gradient.addColorStop(1, darkenColor(atom.color, 40));

                    ctx.fillStyle = gradient;
                    ctx.fill();

                    ctx.strokeStyle = '#1e3a8a';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();

                    ctx.fillStyle = atom.labelColor;
                    ctx.font = `bold ${atom.r * 0.8}px Helvetica`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(atom.name, atom.x, atom.y);

                    ctx.fillStyle = atom.sign === '+' ? '#3b82f6' : '#ef4444';
                    
                    let signX = atom.x;
                    let signY = atom.y + (atom.name === 'O' ? -atom.r - 12 : atom.r + 14);
                    
                    ctx.beginPath();
                    ctx.arc(signX, signY, 11, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.strokeStyle = '#1e3a8a';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    ctx.fillStyle = '#1e3a8a';
                    ctx.font = 'bold 12px Helvetica';
                    ctx.fillText(atom.sign, signX, signY);
                });

                ctx.strokeStyle = '#2563eb';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.arc(cx, cy, canvas.width * 0.43, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);

                dipoleAnimId = requestAnimationFrame(draw);
            }
            draw();
        }

        function darkenColor(hex, percent) {
            let num = parseInt(hex.replace("#",""),16),
            amt = Math.round(2.55 * percent),
            R = (num >> 16) - amt,
            G = (num >> 8 & 0x00FF) - amt,
            B = (num & 0x0000FF) - amt;
            return "#" + (0x1000000 + (R<255?R<0?0:R:255)*0x10000 + (G<255?G<0?0:G:255)*0x100 + (B<255?B<0?0:B:255)).toString(16).slice(1);
        }

        let currentState = 'solid'; 
        let particles = [];

        function setWaterState(state) {
            currentState = state;
            const buttons = ['solid', 'liquid', 'gas'];
            buttons.forEach(b => {
                const btn = document.getElementById(`btn-state-${b}`);
                if (btn) {
                    if (b === state) {
                        btn.className = "molecule-badge py-2 px-3 text-left text-xs font-semibold flex items-center justify-between transition-all duration-200 active-badge";
                    } else {
                        btn.className = "molecule-badge py-2 px-3 text-left text-xs font-semibold flex items-center justify-between transition-all duration-200";
                    }
                }
            });

            const info = document.getElementById('state-info');
            if (info) {
                if (state === 'solid') {
                    info.innerHTML = "<strong>Stan stały (Lód):</strong> Cząsteczki tworzą sztywną, przestrzenną sieć sześciokątną. Odległości między nimi są większe niż w stanie ciekłym (struktura ażurowa), co zmniejsza gęstość.";
                } else if (state === 'liquid') {
                    info.innerHTML = "<strong>Stan ciekły (Woda):</strong> Cząsteczki leżą blisko siebie, wiązania wodorowe ciągle pękają i tworzą się na nowo, umożliwiając ruch i płynność.";
                } else if (state === 'gas') {
                    info.innerHTML = "<strong>Stan gazowy (Para wodna):</strong> Cząsteczki mają wysoką energię kinetyczną, poruszają się swobodnie z dużymi prędkościami i niemal nie oddziałują ze sobą.";
                }
            }

            resetParticles(state);
        }

        function resetParticles(state) {
            const canvas = document.getElementById('state-canvas');
            if (!canvas) return;

            particles = [];
            const count = state === 'gas' ? 12 : (state === 'solid' ? 24 : 32);
            
            if (state === 'solid') {
                const rows = 4;
                const cols = 6;
                const spacingX = canvas.width * 0.137;
                const spacingY = canvas.height * 0.16;
                const offsetX = canvas.width * 0.137;
                const offsetY = canvas.height * 0.18;

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        let px = offsetX + c * spacingX + (r % 2 === 0 ? 0 : spacingX / 2);
                        let py = offsetY + r * spacingY;
                        
                        particles.push({
                            x: px,
                            y: py,
                            origX: px,
                            origY: py,
                            vx: 0,
                            vy: 0,
                            size: canvas.width * 0.025,
                            pulseAngle: Math.random() * Math.PI * 2
                        });
                    }
                }
            } else if (state === 'liquid') {
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: 50 + Math.random() * (canvas.width - 100),
                        y: 80 + Math.random() * (canvas.height - 130),
                        vx: (Math.random() - 0.5) * 0.8,
                        vy: (Math.random() - 0.5) * 0.8,
                        size: canvas.width * 0.025
                    });
                }
            } else if (state === 'gas') {
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: 30 + Math.random() * (canvas.width - 60),
                        y: 30 + Math.random() * (canvas.height - 60),
                        vx: (Math.random() - 0.5) * 3.5,
                        vy: (Math.random() - 0.5) * 3.5,
                        size: canvas.width * 0.025
                    });
                }
            }
        }

        function initStateAnimation() {
            const canvas = document.getElementById('state-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            function draw() {
                // Zabezpieczenie przed wyciekiem animacji
                const currentCanvas = document.getElementById('state-canvas');
                if (!currentCanvas) {
                    if (stateAnimId) cancelAnimationFrame(stateAnimId);
                    return;
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = '#cbd5e1';
                ctx.lineWidth = 4;
                ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

                const currentSize = canvas.width * 0.025;

                if (currentState === 'solid') {
                    particles.forEach(p => {
                        p.pulseAngle += 0.15;
                        p.x = p.origX + Math.sin(p.pulseAngle) * 1.5;
                        p.y = p.origY + Math.cos(p.pulseAngle * 0.8) * 1.5;
                    });

                    ctx.strokeStyle = 'rgba(59, 130, 246, 0.4)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([4, 4]);
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dist = Math.hypot(particles[i].x - particles[j].x, particles[i].y - particles[j].y);
                            if (dist < canvas.width * 0.16) {
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.stroke();
                            }
                        }
                    }
                    ctx.setLineDash([]);
                } else if (currentState === 'liquid') {
                    particles.forEach(p => {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.01;

                        if (p.x < 25) { p.x = 25; p.vx *= -1; }
                        if (p.x > canvas.width - 25) { p.x = canvas.width - 25; p.vx *= -1; }
                        if (p.y < 50) { p.y = 50; p.vy *= -1; }
                        if (p.y > canvas.height - 25) { p.y = canvas.height - 25; p.vy = -Math.abs(p.vy) * 0.9; }

                        p.vx *= 0.99;
                        p.vy *= 0.99;
                    });

                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dist = Math.hypot(particles[i].x - particles[j].x, particles[i].y - particles[j].y);
                            if (dist < currentSize * 2.2) {
                                ctx.strokeStyle = 'rgba(59, 130, 246, 0.2)';
                                ctx.lineWidth = 1.5;
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.stroke();

                                const angle = Math.atan2(particles[j].y - particles[i].y, particles[j].x - particles[i].x);
                                particles[i].vx -= Math.cos(angle) * 0.15;
                                particles[i].vy -= Math.sin(angle) * 0.15;
                                particles[j].vx += Math.cos(angle) * 0.15;
                                particles[j].vy += Math.sin(angle) * 0.15;
                            }
                        }
                    }
                } else if (currentState === 'gas') {
                    particles.forEach(p => {
                        p.x += p.vx;
                        p.y += p.vy;

                        if (p.x < 25 || p.x > canvas.width - 25) p.vx *= -1;
                        if (p.y < 25 || p.y > canvas.height - 25) p.vy *= -1;

                        p.x = Math.max(25, Math.min(canvas.width - 25, p.x));
                        p.y = Math.max(25, Math.min(canvas.height - 25, p.y));
                    });
                }

                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, currentSize, 0, Math.PI * 2);
                    ctx.fillStyle = '#ef4444';
                    ctx.fill();
                    ctx.strokeStyle = '#1e3a8a';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    const offsetAngle = currentState === 'solid' ? 0 : (p.x * 0.05);
                    const hDist = currentSize * 0.8;
                    const hRadius = currentSize * 0.5;

                    const hPositions = [
                        { x: p.x + Math.cos(0.9 + offsetAngle) * hDist, y: p.y + Math.sin(0.9 + offsetAngle) * hDist },
                        { x: p.x + Math.cos(-0.9 + offsetAngle) * hDist, y: p.y + Math.sin(-0.9 + offsetAngle) * hDist }
                    ];

                    hPositions.forEach(pos => {
                        ctx.beginPath();
                        ctx.arc(pos.x, pos.y, hRadius, 0, Math.PI * 2);
                        ctx.fillStyle = '#3b82f6';
                        ctx.fill();
                        ctx.strokeStyle = '#1e3a8a';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    });
                });

                stateAnimId = requestAnimationFrame(draw);
            }
            draw();
        }

        let fishAngle = 0;

        function initLakeAnimation() {
            const canvas = document.getElementById('lake-canvas');
            const slider = document.getElementById('temp-slider');
            const tempDisplay = document.getElementById('temp-display');
            const infoBox = document.getElementById('lake-info-box');

            if (!canvas || !slider) return;

            const ctx = canvas.getContext('2d');
            let currentTemp = parseInt(slider.value);

            // Aktualizacja suwaka
            slider.addEventListener('input', (e) => {
                currentTemp = parseInt(e.target.value);
                if (tempDisplay) tempDisplay.textContent = `${currentTemp}°C`;
                updateLakeText(currentTemp);
            });

            function updateLakeText(temp) {
                if (!infoBox) return;
                if (temp < 0) {
                    infoBox.innerHTML = `<strong>Mrozny klimat: (${temp}°C)</strong> Powierzchnia zamarza tworząc izolacyjną warstwę lodu (0°C). Przy dnie woda zachowuje bezpieczną temperaturę 4°C, chroniąc ryby przed zamarznięciem!`;
                } else if (temp === 4) {
                    infoBox.innerHTML = `<strong>Punkt maksymalnej gestosci (4°C):</strong> Woda w całym zbiorniku miesza się naturalnie. Ma największą wagę i opada głęboko na dno.`;
                } else if (temp > 4 && temp <= 15) {
                    infoBox.innerHTML = `<strong>Klimat umiarkowany (${temp}°C):</strong> Warstwa powierzchniowa jest cieplejsza, a przy dnie nadal zalega cięższa, chłodniejsza woda o temperaturze ok. 4°C.`;
                } else if (temp > 15) {
                    infoBox.innerHTML = `<strong>Upalne lato (${temp}°C):</strong> Wyraźne rozwarstwienie (termoklina). Ciepła woda na górze, najzimniejsza i najgęstsza (ok. 4°C) bezpiecznie na samym dnie.`;
                }
            }

            updateLakeText(currentTemp);

            function draw() {
                const currentCanvas = document.getElementById('lake-canvas');
                if (!currentCanvas) {
                    if (lakeAnimId) cancelAnimationFrame(lakeAnimId);
                    return;
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const width = canvas.width;
                const height = canvas.height;

                const edgeOffset = width * 0.09;

                let skyGradient = ctx.createLinearGradient(0, 0, 0, 80);
                if (currentTemp <= 0) {
                    skyGradient.addColorStop(0, '#e2e8f0');
                    skyGradient.addColorStop(1, '#cbd5e1');
                } else {
                    skyGradient.addColorStop(0, '#bae6fd');
                    skyGradient.addColorStop(1, '#7dd3fc');
                }
                ctx.fillStyle = skyGradient;
                ctx.fillRect(0, 0, width, 80);

                ctx.fillStyle = currentTemp <= 0 ? '#f1f5f9' : '#854d0e';
                ctx.beginPath();
                ctx.moveTo(0, 80);
                ctx.lineTo(edgeOffset, 110);
                ctx.lineTo(edgeOffset, height);
                ctx.lineTo(0, height);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(width, 80);
                ctx.lineTo(width - edgeOffset, 110);
                ctx.lineTo(width - edgeOffset, height);
                ctx.lineTo(width, height);
                ctx.closePath();
                ctx.fill();

                let waterGradient = ctx.createLinearGradient(0, 90, 0, height);
                let topTemp, midTemp, bottomTemp;
                
                if (currentTemp <= 0) {
                    topTemp = 0;
                    midTemp = 2;
                    bottomTemp = 4;
                    waterGradient.addColorStop(0, '#93c5fd');
                    waterGradient.addColorStop(0.12, '#3b82f6');
                    waterGradient.addColorStop(1, '#1e3a8a');
                } else if (currentTemp === 4) {
                    topTemp = 4;
                    midTemp = 4;
                    bottomTemp = 4;
                    waterGradient.addColorStop(0, '#2563eb');
                    waterGradient.addColorStop(1, '#1d4ed8');
                } else {
                    topTemp = currentTemp;
                    midTemp = Math.round(currentTemp * 0.6);
                    bottomTemp = 4;
                    waterGradient.addColorStop(0, '#38bdf8');
                    waterGradient.addColorStop(0.5, '#0284c7');
                    waterGradient.addColorStop(1, '#1e3a8a');
                }

                ctx.fillStyle = waterGradient;
                ctx.fillRect(edgeOffset, 90, width - (edgeOffset * 2), height - 90);

                if (currentTemp <= 0) {
                    ctx.fillStyle = '#f8fafc';
                    ctx.fillRect(edgeOffset, 80, width - (edgeOffset * 2), 12);
                    ctx.strokeStyle = '#e2e8f0';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(width * 0.22, 80); ctx.lineTo(width * 0.24, 88); ctx.lineTo(width * 0.27, 84);
                    ctx.moveTo(width * 0.55, 80); ctx.lineTo(width * 0.54, 86); ctx.lineTo(width * 0.57, 92);
                    ctx.moveTo(width * 0.71, 80); ctx.lineTo(width * 0.73, 90);
                    ctx.stroke();
                }

                ctx.font = 'bold 12px Helvetica';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                
                ctx.fillText(`Powierzchnia: ${topTemp}°C`, width/2, 115);
                ctx.fillText(`Środek: ${midTemp}°C`, width/2, 180);
                ctx.fillText(`Dno (największa gęstość): ${bottomTemp}°C`, width/2, 255);

                fishAngle += 0.02;
                const fishX = width / 2 + Math.sin(fishAngle) * (width * 0.2);
                const fishY = height - 45 + Math.cos(fishAngle * 1.5) * 5;
                const movingLeft = Math.cos(fishAngle) < 0;

                drawFish(ctx, fishX, fishY, movingLeft);

                lakeAnimId = requestAnimationFrame(draw);
            }

            function drawFish(cContext, fx, fy, lookingLeft) {
                cContext.save();
                cContext.translate(fx, fy);
                if (lookingLeft) {
                    cContext.scale(-1, 1);
                }

                cContext.fillStyle = '#475569';
                cContext.beginPath();
                cContext.ellipse(0, 0, 18, 8, 0, 0, Math.PI * 2);
                cContext.fill();

                cContext.fillStyle = '#94a3b8';
                cContext.beginPath();
                cContext.ellipse(0, 2, 14, 5, 0, 0, Math.PI * 2);
                cContext.fill();

                cContext.fillStyle = '#cbd5e1';
                cContext.beginPath();
                cContext.moveTo(-16, 0);
                cContext.lineTo(-24, -8);
                cContext.lineTo(-21, 0);

        let isHeating = false;

        function setBoilingLocation(loc) {

        function initBoilingAnimation() {
            const canvas = document.getElementById('boil-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            setBoilingLocation('sea');

            function draw() {
                const currentCanvas = document.getElementById('boil-canvas');
                const indicator = document.getElementById('boil-temp-indicator');
                if (!currentCanvas || !indicator) {
                    if (boilAnimId) cancelAnimationFrame(boilAnimId);
                    return;
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const cx = canvas.width / 2;

                if (isHeating) {
                    if (waterTemp < boilPoint) {
                        waterTemp += 0.18;
                    } else {
                        waterTemp = boilPoint;
                    }
                } else {
                    if (waterTemp > 20) {
                        waterTemp -= 0.1;
                    }
                }

                indicator.textContent = Math.floor(waterTemp);

                const containerW = canvas.width * 0.3;
                const containerH = canvas.height * 0.5;
                const baseLineY = canvas.height * 0.78;

                if (isHeating) {
                    let flameGrad = ctx.createLinearGradient(0, baseLineY, 0, baseLineY + 30);
                    flameGrad.addColorStop(0, 'rgba(239, 68, 68, 0)');
                    flameGrad.addColorStop(0.5, 'rgba(249, 115, 22, 0.8)');
                    flameGrad.addColorStop(1, 'rgba(239, 68, 68, 0.9)');
                    ctx.fillStyle = flameGrad;

                    ctx.beginPath();
                    for (let x = cx - containerW * 0.9; x <= cx + containerW * 0.9; x += 10) {
                        const h = (baseLineY - 10) + Math.sin(x + Date.now() * 0.02) * 8;
                        if (x === cx - containerW * 0.9) ctx.moveTo(x, baseLineY + 20);
                        else ctx.lineTo(x, h);
                    }
                    ctx.lineTo(cx + containerW * 0.9, baseLineY + 20);
                    ctx.closePath();
                    ctx.fill();
                }

                ctx.fillStyle = '#475569';
                ctx.fillRect(cx - containerW * 1.1, baseLineY + 15, containerW * 2.2, 8);

                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(cx - containerW, baseLineY - containerH);
                ctx.lineTo(cx - containerW, baseLineY);
                ctx.lineTo(cx + containerW, baseLineY);
                ctx.lineTo(cx + containerW, baseLineY - containerH);
                ctx.stroke();

                let waterColor = 'rgba(56, 189, 248, 0.3)';
                if (waterTemp > 50) {
                    waterColor = `rgba(14, 165, 233, ${0.3 + (waterTemp - 50) * 0.002})`;
                }
                ctx.fillStyle = waterColor;
                ctx.fillRect(cx - containerW + 2, baseLineY - containerH * 0.7, containerW * 2 - 4, containerH * 0.7);

                ctx.fillStyle = waterColor;
                ctx.beginPath();
                ctx.moveTo(cx - containerW + 2, baseLineY - containerH * 0.7);
                for (let x = cx - containerW + 2; x <= cx + containerW - 2; x += 5) {
                    const waveAmp = waterTemp >= boilPoint ? 4 : (waterTemp > 60 ? 1.5 : 0.5);
                    const waveSpeed = waterTemp >= boilPoint ? 0.05 : 0.02;
                    const wy = (baseLineY - containerH * 0.7) + Math.sin(x * 0.1 + Date.now() * waveSpeed) * waveAmp;
                    ctx.lineTo(x, wy);
                }
                ctx.lineTo(cx + containerW - 2, baseLineY);
                ctx.lineTo(cx - containerW + 2, baseLineY);
                ctx.closePath();
                ctx.fill();

                const currentBoilThreshold = boilPoint - 15;
                if (waterTemp > currentBoilThreshold) {
                    const intensity = Math.min(10, Math.floor((waterTemp - currentBoilThreshold) * 1.5));
                    
                    if (Math.random() * 10 < intensity) {
                        bubbleParticles.push({
                            x: cx - containerW * 0.8 + Math.random() * (containerW * 1.6),
                            y: baseLineY - 5,
                            size: 1 + Math.random() * 4,
                            speed: 1 + Math.random() * 3
                        });
                    }
                }

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                for (let i = bubbleParticles.length - 1; i >= 0; i--) {
                    const b = bubbleParticles[i];
                    b.y -= b.speed;
                    b.x += (Math.random() - 0.5) * 1.5;

                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                    ctx.stroke();

                    if (b.y < baseLineY - containerH * 0.7) {
                        if (waterTemp >= boilPoint - 5) {
                            steamParticles.push({
                                x: b.x,
                                y: baseLineY - containerH * 0.7 - 5,
                                size: 3,
                                opacity: 0.6,
                                vx: (Math.random() - 0.5) * 0.5,
                                vy: -1 - Math.random() * 1
                            });
                        }
                        bubbleParticles.splice(i, 1);
                    }
                }

                if (waterTemp > 50 && Math.random() < 0.4) {
                    steamParticles.push({
                        x: cx - containerW * 0.7 + Math.random() * (containerW * 1.4),
                        y: baseLineY - containerH * 0.7 - 10,
                        size: 4 + Math.random() * 8,
                        opacity: (waterTemp - 50) / (boilPoint - 50) * 0.5,
                        vx: (Math.random() - 0.5) * 0.3,
                        vy: -0.8 - Math.random() * 1
                    });
                }

                for (let i = steamParticles.length - 1; i >= 0; i--) {
                    const s = steamParticles[i];
                    s.x += s.vx;
                    s.y += s.vy;
                    s.size += 0.2;
                    s.opacity -= 0.008;

                    if (s.opacity <= 0 || s.y < 30) {
                        steamParticles.splice(i, 1);
                    } else {
                        ctx.fillStyle = `rgba(148, 163, 184, ${s.opacity})`;
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                boilAnimId = requestAnimationFrame(draw);
            }
            draw();
        }

                    ctx.beginPath();

                            <button onclick="currentSlide = 0; renderSlide();" class="px-5 py-2.5 border border-blue-300 text-blue-600 hover:bg-blue-50 text-xs font-bold rounded shadow-sm transition-all">
                                Wróć do początku lekcji
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        function startQuiz() {
            quizState = 'question';
            renderQuizContent();
        }

        function selectOption(idx) {
            if (quizState !== 'question') return;
            selectedOption = idx;
            quizState = 'feedback';
            if (idx === quizQuestions[currentQuestion].correct) {
                score++;
            }
            renderQuizContent();
        }

        renderSlide();
    </script>
</body>
</html>
